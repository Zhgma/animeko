name: Publish Animecomic release packages
on:
  push:
    branches: [release-artifacts]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-animecomic-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Zhgma/animeko' && github.ref == 'refs/heads/release-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test release channel rules
        run: python3 -m unittest -v test_publish.py test_collect_ios.py
      - name: Collect pinned iOS Release build when requested
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 collect_ios.py
      - name: Verify packages, upload draft, verify downloads and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 publish.py
      - name: Save verified release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release.json
          retention-days: 30
