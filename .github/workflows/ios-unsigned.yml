name: Build unsigned iOS IPA
on:
  push:
    branches: [build/ios-unsigned]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    if: github.repository == 'Zhgma/animeko'
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure iOS Release build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          cat > local.properties <<'EOF'
          ani.enable.ios=true
          ani.build.framework=true
          ani.enable.firebase=false
          jvm.toolchain.vendor=Eclipse Adoptium
          jvm.toolchain.version=21
          EOF
          xcodebuild -version
          pod --version
          mkdir -p ipa-output
      - name: Install iOS dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:ios:podInstall --console=plain --no-configuration-cache --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            '-Dkotlin.daemon.jvm.options=-Xmx3g' 2>&1 | tee ipa-output/pod-install.log
      - name: Build Release IPA for user signing
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:ios:buildReleaseIpa --console=plain --no-configuration-cache --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' \
            '-Dkotlin.daemon.jvm.options=-Xmx3g' 2>&1 | tee ipa-output/build.log
      - name: Verify and collect IPA
        run: python3 ci-helper/verify/unsigned_ipa.py app/ios/build/archives/release/Animeko.ipa ipa-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animecomic-ios-unsigned-${{ github.sha }}
          path: ipa-output/
          if-no-files-found: error
          retention-days: 30
